[project]
name = "phl-risk"
version = "0.10.0"
description = "Declarative analysis and auditable data quality, preparation and workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5,<3",
    "pandas>=3.0,<4",
    "scikit-learn>=1.9,<2",
    "joblib>=1.6,<2",
    "scipy>=1.18,<2",
    "filelock>=3.16,<4",
    "pandas-stubs~=3.0.5",
    "scipy-stubs~=1.18.1",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6,<7"]
lightgbm = ["lightgbm>=4.0,<5", "PyYAML>=6,<7"]
hydra = ["hydra-core>=1.3,<2"]
binning = [
    "optbinning>=0.21,<0.22",
    "protobuf>=5.26.1,<5.27",
]
pytorch = [
    "pyyaml>=6,<7",
    "torch>=2.6,<3",
]
torchkeras = [
    "accelerate>=1,<2",
    "matplotlib>=3.9,<4",
    "pyyaml>=6,<7",
    "torch>=2.6,<3",
    "torchkeras==3.9.9",
    "torchmetrics>=1,<2",
]
tensorboard = [
    "tensorboard>=2.18,<3",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbclient>=0.10,<1",
    "nbconvert>=7,<8",
    "nbformat>=5.10,<6",
    "pytest>=8,<10",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
