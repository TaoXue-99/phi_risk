[project]
name = "phl-risk"
version = "0.3.0"
description = "Declarative analysis and auditable data quality, preparation and workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.5,<3", "pandas>=3.0,<4", "scikit-learn>=1.9,<2", "joblib>=1.6,<2", "scipy>=1.18,<2"]

[project.optional-dependencies]
binning = [
    "optbinning>=0.21,<0.22",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8,<10",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
