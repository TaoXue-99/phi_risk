name: tests
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
        extras: ['', '[binning]', '[lightgbm,hydra]']
        exclude:
          # Official OptBinning 0.21 pins OR-Tools <9.12 (no CPython 3.13 wheel).
          - python: '3.13'
            extras: '[binning]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".${{ matrix.extras }}" pytest ruff build
      - run: python -m pytest -q -W error
      - run: ruff check src/phl_risk tests examples benchmarks
      - run: ruff format --check src/phl_risk tests examples benchmarks
      - run: python examples/analysis_examples.py
      - run: python examples/conditional_measures.py
      - run: python examples/analysis_diagnostics.py
      - run: python examples/funnel_examples.py
      - run: python examples/psi_examples.py
      - run: python examples/shared_bin_edges.py
      - run: python examples/modeling_plan.py
      - run: python examples/data_prep_lifecycle.py
      - run: python examples/data_quality_basic.py
      - run: python examples/data_prep_basic.py
      - if: matrix.extras == '[binning]'
        run: |
          python examples/optbinning_prep.py
          python examples/data_workflow_risk.py
      - if: matrix.extras == '[lightgbm,hydra]'
        run: python examples/modeling/lightgbm_experiment.py --root /tmp/phl-risk-example
      - run: python -m build

  lightgbm-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lightgbm: ['4.0.0', '4.1.0', '4.2.0', '4.3.0', '4.4.0', '4.5.0', '4.6.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[lightgbm,hydra]' 'lightgbm==${{ matrix.lightgbm }}' pytest
      - run: python -m pytest tests/modeling/experiment -q -W error

  deep-learning:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
        extras: ['pytorch', 'torchkeras,tensorboard,hydra']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # CPU wheels keep these correctness tests independent of CUDA downloads.
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[${{ matrix.extras }}]' pytest
      - run: >-
          python -m pytest tests/modeling/models tests/modeling/training
          tests/modeling/experiment/pytorch tests/examples/test_esmm_guide.py -q -W error
      - run: >-
          python examples/modeling/esmm_mmoe_large_scale.py --rows 1000 --epochs 1
          --backend native --no-tensorboard --root /tmp/esmm-ci
      - if: matrix.extras == 'torchkeras,tensorboard,hydra'
        run: >-
          python examples/modeling/esmm_mmoe_large_scale.py --rows 1000 --epochs 1
          --backend torchkeras --device cpu --root /tmp/esmm-ci-torchkeras
