name: tests
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest ruff
      - run: python -m pytest -q -W error
      - run: ruff check src/phl_risk tests examples benchmarks
      - run: ruff format --check src/phl_risk tests examples benchmarks
      - run: python examples/analysis_examples.py
      - run: python examples/funnel_examples.py
